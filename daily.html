<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICI ou là - daily</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="script_game.js" defer></script>
</head>

<body class="play">

  <div class="page">

    <header class="header">
      <a class="ici-brand" href="ici ou là.html" aria-label="ICI, accueil">
        <img src="https://www.ici.fr/client/immutable/assets/logo-ici-small.DwiLDMIK.svg" alt="ici">
      </a>
      <span class="header-context">Le média de la vie locale</span>
    </header>

    <main class="game">

      <div class="game-heading">
        <p class="eyebrow">5 articles, 5 lieux à retrouver</p>
        <h1>ICI ou là</h1>
      </div>

      <div class="game-meta">
        <div class="progression">Article <span id="numero"></span><span aria-hidden="true"> / 5</span></div>
        <span class="instruction">Placez votre repère sur la carte</span>
      </div>

      <section class="question-card" aria-label="Question en cours">
        <div class="article"></div>
        <p class="article-link"></p>
      </section>
      <div id="feedback" aria-live="polite"></div>
      <button id="next-button" style="display:none;">
        Article suivant
      </button>

      <div id="end-screen" style="display:none;">
        <p class="eyebrow">Partie terminée</p>
        <h2 id="end-title"></h2>
        <p id="end-message"></p>
        <p class="score-total"><span id="final-score"></span><span> points</span></p>
        <div class="score-actions">
          <button id="share-button">Partager</button>
          <a href="ici ou là.html">Retour à l'accueil</a>
        </div>
        <ol class="recap" id="recap"></ol>
      </div>

      <div id="map-container" aria-label="Carte de France : cliquez à l'endroit où vous situez le lieu"></div>

    </main>

    <footer class="footer">
      D'après les articles de <a href="https://www.ici.fr/" target="_blank" rel="noreferrer">ici.fr</a>
    </footer>

  </div>

  <div id="share-overlay" style="display:none;">
    <div class="share-sheet" role="dialog" aria-modal="true" aria-label="Partager la partie">
      <p class="share-title">Partager</p>
      <a class="share-option" href="#" data-partage="copy"><span class="share-emoji">🔗</span> Copier le lien</a>
      <a class="share-option" href="#" data-partage="email"><span class="share-emoji">✉️</span> Email</a>

      <button id="share-cancel">Annuler</button>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

</body>

</html>
